apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsar
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsar
  template:
    metadata:
      labels:
        app: pulsar
    spec:
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:latest
          command: ["bin/pulsar", "standalone"]
          ports:
            - containerPort: 6650
              name: broker
            - containerPort: 8080
              name: admin
          env:
            - name: PULSAR_PREFIX_advertisedAddress
              value: "pulsar"
            - name: PULSAR_MEM
              value: "-Xms512m -Xmx1g"
          readinessProbe:
            httpGet:
              path: /admin/v2/namespaces/public/default
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
  namespace: default
spec:
  selector:
    app: pulsar
  ports:
    - name: broker
      port: 6650
      targetPort: 6650
    - name: admin
      port: 8080
      targetPort: 8080
